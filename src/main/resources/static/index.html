<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyMarket — Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-form-panel">
    <div class="login-logo">
      <span class="logo-easy">EASY</span><span class="logo-market">MARKET</span>
    </div>
    <p class="login-tagline">Sistema de Gestão — v1.0</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" placeholder="admin@easymarket.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        <a href="#" class="forgot-link">Esqueci minha senha</a>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Entrar no Sistema</button>
      <div id="loginError" class="login-error hidden">
        E-mail ou senha inválidos.
      </div>
    </form>
  </div>

  <div class="login-promo">
    <div class="promo-inner">
      <div class="promo-ghost">EASY<br>MARKET</div>
      <h2>Gestão Completa</h2>
      <p>PDV · Estoque · Clientes<br>Fornecedores · Relatórios<br>Atendimento Remoto</p>
      <hr class="promo-divider">
      <p class="promo-notes">
        RNF-004 — Autenticação segura<br>
        RNF-005 — Resposta &lt; 3 segundos<br>
        RNF-006 — Chrome, Firefox, Edge
      </p>
    </div>
  </div>
</div>

<script>
  const existingUser = sessionStorage.getItem('em_user');
  if (existingUser) {
    try {
      const u = JSON.parse(existingUser);
      if (u.idFuncionario && u.cargo) window.location.href = 'app.html';
    } catch (_) {}
  }

  const cargoLabels = { GERENTE: 'Gerente', OPERADOR: 'Operador', ESTOQUISTA: 'Estoquista' };

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');
    err.classList.add('hidden');

    if (!email || !senha) { err.classList.remove('hidden'); return; }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });

      if (!res.ok) { err.classList.remove('hidden'); return; }

      const data = await res.json();
      sessionStorage.setItem('em_user', JSON.stringify({
        idFuncionario: data.idFuncionario,
        email: data.email,
        name: data.nome,
        cargo: data.cargo,
        role: cargoLabels[data.cargo] || data.cargo
      }));
      window.location.href = 'app.html';
    } catch (_) {
      err.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar no Sistema';
    }
  });
</script>
</body>
</html>
